<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Viewport ─────────────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary SEO ──────────────────────────────────────────────────── -->
    <title>Axiomwriter — AI Writing Platform for Fiction Authors</title>
    <meta name="description" content="Axiomwriter is an AI-powered writing intelligence platform for fiction authors. Manage your manuscript, characters, lore bible, and plot threads — all in sync. Free to start." />
    <meta name="keywords" content="writing app, fiction writing software, novel writing, AI writing assistant, manuscript editor, world building, character tracking, lore bible, plot threads, book writing app" />
    <meta name="author" content="Stacked Alchemist LLC" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://axiomwriter.com/" />

    <!-- ── Open Graph (Facebook, LinkedIn, Discord, Slack) ──────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Axiomwriter" />
    <meta property="og:url"         content="https://axiomwriter.com/" />
    <meta property="og:title"       content="Axiomwriter — AI Writing Platform for Fiction Authors" />
    <meta property="og:description" content="The writing platform that keeps your bible in sync with your manuscript. AI that understands your specific world, characters, and voice." />
    <meta property="og:image"       content="https://axiomwriter.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="Axiomwriter writing workspace" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter / X Card ────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@stackedalchemist" />
    <meta name="twitter:title"       content="Axiomwriter — AI Writing Platform for Fiction Authors" />
    <meta name="twitter:description" content="The writing platform that keeps your bible in sync with your manuscript. AI that understands your specific world." />
    <meta name="twitter:image"       content="https://axiomwriter.com/og-image.png" />

    <!-- ── JSON-LD Structured Data ──────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Axiomwriter",
      "url": "https://axiomwriter.com",
      "description": "AI-powered writing intelligence platform for fiction authors. Manage manuscripts, characters, lore bibles, and plot threads — all in sync.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Web, iOS, Android",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD"
        },
        {
          "@type": "Offer",
          "name": "Writer",
          "price": "9.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        },
        {
          "@type": "Offer",
          "name": "Composer",
          "price": "19.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        },
        {
          "@type": "Offer",
          "name": "Architect",
          "price": "39.99",
          "priceCurrency": "USD",
          "billingIncrement": "P1M"
        }
      ],
      "author": {
        "@type": "Organization",
        "name": "Stacked Alchemist LLC",
        "url": "https://stackedalchemist.dev"
      },
      "featureList": [
        "Manuscript editor with chapter and scene structure",
        "Character profiles with Voice DNA",
        "Lore Bible with AI consistency checking",
        "Plot Thread Detector",
        "AI Composer Mode",
        "World Map Builder",
        "Book Cover Studio",
        "Publishing export for KDP and IngramSpark",
        "Series architecture and continuity tracking",
        "Beta reader sharing"
      ]
    }
    </script>

    <!-- ── PWA Manifest ─────────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme & brand ────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#C9A84C" />
    <meta name="application-name" content="Axiomwriter" />

    <!-- ── iOS PWA meta tags ─────────────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Axiomwriter" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- ── Favicon ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- ── Fonts ─────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Josefin+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Prevent flash of unstyled content */
      html { background-color: #080818; }
      /* Safe area insets for notched phones */
      body {
        padding-top:    env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left:   env(safe-area-inset-left);
        padding-right:  env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
